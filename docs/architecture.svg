<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1240" viewBox="0 0 1180 1240" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1180" height="1240" fill="#f8fafc"/>

  <!-- title -->
  <text x="590" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Competitors News — Webex Bot Architecture</text>
  <text x="590" y="74" text-anchor="middle" font-size="15" fill="#64748b">How your message becomes a sourced competitive-news digest</text>

  <!-- ============ ZONE 1: YOU / WEBEX ============ -->
  <rect x="40" y="100" width="1100" height="210" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="64" y="128" font-size="14" font-weight="700" fill="#1d4ed8" letter-spacing="1">1 · YOU + WEBEX CLOUD</text>

  <!-- user -->
  <rect x="70" y="150" width="240" height="130" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="182" text-anchor="middle" font-size="34">🧑‍💻</text>
  <text x="190" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">You, in a Webex space</text>
  <text x="190" y="240" text-anchor="middle" font-size="12.5" fill="#475569">"@Competitors News</text>
  <text x="190" y="258" text-anchor="middle" font-size="12.5" fill="#475569">top 5 Arista news this week"</text>

  <!-- webex cloud -->
  <rect x="450" y="150" width="280" height="130" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="182" text-anchor="middle" font-size="34">☁️</text>
  <text x="590" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Webex Cloud</text>
  <text x="590" y="238" text-anchor="middle" font-size="12.5" fill="#475569">Sees the @mention, looks up</text>
  <text x="590" y="256" text-anchor="middle" font-size="12.5" fill="#475569">the registered webhook</text>

  <!-- bot identity -->
  <rect x="850" y="150" width="260" height="130" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="182" text-anchor="middle" font-size="34">🤖</text>
  <text x="980" y="214" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Bot account</text>
  <text x="980" y="238" text-anchor="middle" font-size="12.5" fill="#475569">Cnews@webex.bot</text>
  <text x="980" y="256" text-anchor="middle" font-size="11.5" fill="#94a3b8">(identity + token only,</text>
  <text x="980" y="272" text-anchor="middle" font-size="11.5" fill="#94a3b8">runs no code)</text>

  <!-- arrows within zone 1 -->
  <line x1="310" y1="215" x2="446" y2="215" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="215" x2="846" y2="215" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ============ WEBHOOK BRIDGE ============ -->
  <line x1="590" y1="310" x2="590" y2="356" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="386" y="320" width="408" height="34" rx="17" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="590" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">🔗 WEBHOOK  →  POST https://competitors-news.onrender.com/webhook</text>

  <!-- ============ ZONE 2: RENDER SERVER ============ -->
  <rect x="40" y="370" width="1100" height="430" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="64" y="398" font-size="14" font-weight="700" fill="#0d9488" letter-spacing="1">2 · YOUR SERVER ON RENDER.COM  (the code I built, running 24/7 in a Docker container)</text>

  <!-- app.py -->
  <rect x="70" y="420" width="320" height="160" rx="12" fill="#ffffff" stroke="#5eead4" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">app.py  ·  Flask webhook</text>
  <text x="86" y="478" font-size="12.5" fill="#475569">• Receives the POST from Webex</text>
  <text x="86" y="500" font-size="12.5" fill="#475569">• Ignores the bot's own messages</text>
  <text x="86" y="522" font-size="12.5" fill="#475569">• Strips the @mention text</text>
  <text x="86" y="544" font-size="12.5" fill="#475569">• Replies 200 instantly, then runs</text>
  <text x="86" y="563" font-size="12.5" fill="#475569">  the hunt in a background thread</text>

  <!-- analyst.py -->
  <rect x="430" y="420" width="320" height="160" rx="12" fill="#ffffff" stroke="#5eead4" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">analyst.py  ·  the brain</text>
  <text x="446" y="478" font-size="12.5" fill="#475569">• Loads the competitive-news SKILL</text>
  <text x="446" y="500" font-size="12.5" fill="#475569">  as the AI's system prompt</text>
  <text x="446" y="522" font-size="12.5" fill="#475569">• Asks Claude to hunt the news</text>
  <text x="446" y="544" font-size="12.5" fill="#475569">• Enforces sources, dates, tags</text>
  <text x="446" y="566" font-size="12.5" fill="#475569">  &amp; the SDxCentral digest format</text>

  <!-- webex_client.py -->
  <rect x="790" y="420" width="320" height="160" rx="12" fill="#ffffff" stroke="#5eead4" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">webex_client.py</text>
  <text x="806" y="478" font-size="12.5" fill="#475569">• Authenticates with the</text>
  <text x="806" y="500" font-size="12.5" fill="#475569">  WEBEX_BOT_TOKEN</text>
  <text x="806" y="522" font-size="12.5" fill="#475569">• Posts the finished digest back</text>
  <text x="806" y="544" font-size="12.5" fill="#475569">  into your Webex space</text>
  <text x="806" y="566" font-size="12.5" fill="#475569">• Splits long answers into chunks</text>

  <!-- skill box -->
  <rect x="70" y="610" width="320" height="160" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="640" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">📘 skill/competitive-news/</text>
  <text x="86" y="668" font-size="12.5" fill="#475569">Your attached skill, verbatim:</text>
  <text x="86" y="690" font-size="12.5" fill="#475569">• Watchlist of 13 OEMs</text>
  <text x="86" y="712" font-size="12.5" fill="#475569">• Hunt order + source map</text>
  <text x="86" y="734" font-size="12.5" fill="#475569">• [VERIFIED]/[INFERRED] tags</text>
  <text x="86" y="756" font-size="12.5" fill="#475569">• Output format rules</text>

  <!-- env vars box -->
  <rect x="430" y="610" width="320" height="160" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="640" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">🔑 Environment variables</text>
  <text x="446" y="668" font-size="12.5" fill="#475569">Set in Render (and your .env):</text>
  <text x="446" y="692" font-size="12.5" fill="#475569">• WEBEX_BOT_TOKEN  (106 chars!)</text>
  <text x="446" y="714" font-size="12.5" fill="#475569">• ANTHROPIC_API_KEY</text>
  <text x="446" y="742" font-size="11.5" fill="#94a3b8">The 401 we fought was a truncated</text>
  <text x="446" y="758" font-size="11.5" fill="#94a3b8">token here — now fixed ✅</text>

  <!-- deploy box -->
  <rect x="790" y="610" width="320" height="160" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="640" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">📦 How it got there</text>
  <text x="806" y="668" font-size="12.5" fill="#475569">• Code lives in GitHub repo</text>
  <text x="806" y="690" font-size="12.5" fill="#475569">  amarv1010-vi/heatmap</text>
  <text x="806" y="712" font-size="12.5" fill="#475569">• Dockerfile builds the container</text>
  <text x="806" y="734" font-size="12.5" fill="#475569">• Render auto-deploys the branch</text>
  <text x="806" y="756" font-size="12.5" fill="#475569">• gunicorn serves it on a URL</text>

  <!-- internal arrows zone 2 -->
  <line x1="390" y1="490" x2="426" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="490" x2="786" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- skill feeds analyst -->
  <line x1="230" y1="610" x2="320" y2="582" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="250" y="600" font-size="10.5" fill="#94a3b8">feeds prompt</text>

  <!-- ============ WEB SEARCH BRIDGE ============ -->
  <line x1="590" y1="582" x2="590" y2="828" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="610" y="690" width="150" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="685" y="708" text-anchor="middle" font-size="11" fill="#475569">live web search</text>
  <text x="685" y="722" text-anchor="middle" font-size="11" fill="#475569">request</text>

  <!-- ============ ZONE 3: AI + WEB ============ -->
  <rect x="40" y="840" width="1100" height="190" rx="14" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1.5"/>
  <text x="64" y="868" font-size="14" font-weight="700" fill="#a21caf" letter-spacing="1">3 · THE INTELLIGENCE LAYER</text>

  <!-- claude -->
  <rect x="120" y="890" width="420" height="120" rx="12" fill="#ffffff" stroke="#e879f9" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="922" text-anchor="middle" font-size="32">🧠</text>
  <text x="330" y="952" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Claude  (Anthropic API)</text>
  <text x="330" y="976" text-anchor="middle" font-size="12.5" fill="#475569">Runs the skill, reads sources, writes the</text>
  <text x="330" y="994" text-anchor="middle" font-size="12.5" fill="#475569">verified, dated, source-linked digest</text>

  <!-- web -->
  <rect x="640" y="890" width="420" height="120" rx="12" fill="#ffffff" stroke="#e879f9" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="922" text-anchor="middle" font-size="32">🌐</text>
  <text x="850" y="952" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Live web search</text>
  <text x="850" y="976" text-anchor="middle" font-size="12.5" fill="#475569">Vendor newsrooms, SEC filings, trade</text>
  <text x="850" y="994" text-anchor="middle" font-size="12.5" fill="#475569">press — fetched fresh, never from memory</text>

  <line x1="540" y1="950" x2="636" y2="950" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="636" y1="965" x2="540" y2="965" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrowBack)"/>

  <!-- ============ RETURN PATH ============ -->
  <path d="M 1110 950 C 1165 950 1165 215 1112 215" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowBack)"/>
  <rect x="980" y="1060" width="190" height="0" />
  <text x="1150" y="600" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488" transform="rotate(90 1150 600)">digest travels back the same path → posted in your space</text>

  <!-- ============ LEGEND / FLOW SUMMARY ============ -->
  <rect x="40" y="1060" width="1100" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="64" y="1090" font-size="15" font-weight="700" fill="#0f172a">The full round trip</text>
  <text x="64" y="1118" font-size="13" fill="#334155">1.  You @mention the bot in Webex  →  2.  Webex fires the webhook to your Render server  →  3.  app.py accepts it</text>
  <text x="64" y="1144" font-size="13" fill="#334155">4.  analyst.py loads your skill + asks Claude  →  5.  Claude hunts the live web for verified, dated, sourced stories</text>
  <text x="64" y="1170" font-size="13" fill="#334155">6.  Claude writes the SDxCentral-style digest  →  7.  webex_client.py posts it back into your space. ✅</text>
  <text x="64" y="1196" font-size="11.5" fill="#94a3b8">Blue = Webex side · Teal = your server &amp; return path · Purple = AI + web · Amber = the skill / webhook link</text>
</svg>
